name: Windows portable
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv pyinstaller
      - run: python scripts/build_windows.py
      - run: python scripts/smoke_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/chaoxin-windows-x64.zip*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
      - run: gh release create "$RELEASE_TAG" chaoxin-windows-x64.zip chaoxin-windows-x64.zip.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes "Windows x64 免安装版。完整解压 ZIP，双击 Chaoxin.exe 启动。"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
  verify-published-update:
    needs: release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/smoke_windows.py --verify-published
