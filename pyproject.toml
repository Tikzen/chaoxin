[project]
name = "chaoxin-console"
version = "0.6.4"
description = "本地学习通账号、课程与异步任务管理"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "cryptography>=44,<48",
  "requests>=2.32.5,<3", "pynacl>=1.5,<2", "pyaes>=1.6.1,<2",
  "beautifulsoup4>=4.14.2,<5", "lxml>=5,<7", "loguru>=0.7.3,<1",
  "fonttools>=4.60.1,<5", "openai>=1.109.1,<3", "tqdm>=4.67.1,<5",
  "httpx[socks]>=0.28.1,<1", "tenacity>=8.2,<10", "typing-extensions>=4.12,<5",
  "pillow>=11,<13", "psutil>=6,<8"
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
